apiVersion: apps/v1
kind: Deployment
metadata:
  name: counter-coordinator
  labels:
    app: counter-coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: counter-coordinator
  template:
    metadata:
      labels:
        app: counter-coordinator
    spec:
      containers:
        - name: coordinator
          image: distributed-app:v2
          imagePullPolicy: Never
          command: ["node", "coordinator.js"]
          ports:
            - containerPort: 4000
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: counter-coordinator
spec:
  selector:
    app: counter-coordinator
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-app-consistent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: distributed-app
  template:
    metadata:
      labels:
        app: distributed-app
    spec:
      containers:
        - name: distributed-app
          image: distributed-app:v2
          imagePullPolicy: Never
          env:
            - name: COORDINATOR_URL
              value: "http://counter-coordinator:4000"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 3
